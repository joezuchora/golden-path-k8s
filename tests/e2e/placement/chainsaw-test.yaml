# Platform check: placement (D-023, D-079, exit criterion 1). Each component renders exactly once, from capability labels only;
# team apps are assigned to workload clusters by group and named per cluster.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: placement
spec:
  steps:
    - name: the in-cluster target is a declarative cluster Secret with both capability labels
      try:
        - assert:
            resource:
              apiVersion: v1
              kind: Secret
              metadata:
                name: cluster-in-cluster
                namespace: argocd
                labels:
                  argocd.argoproj.io/secret-type: cluster
                  platform.example.org/hosts-control-plane: "true"
                  platform.example.org/hosts-workloads: "true"
                  platform.example.org/workload-group: shared
    - name: each component is rendered exactly once, Synced and Healthy
      try:
        - script:
            timeout: 10m
            content: bash ./check-placement.sh
    - name: a workloads-only cluster gets exactly the workloads capability; team apps follow the workload group (split fixture, D-079)
      try:
        - script:
            timeout: 12m
            content: bash ./check-split.sh
