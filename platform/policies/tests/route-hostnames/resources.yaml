metadata: {name: own-host, namespace: team-a-dev}
spec:
  parentRefs: [{name: platform, namespace: platform-gateway, sectionName: https}]
  hostnames: [hello-team-a-dev.apps.kind.test]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: foreign-host, namespace: team-a-dev}
spec:
  parentRefs: [{name: platform, namespace: platform-gateway, sectionName: https}]
  hostnames: [hello-team-b-dev.apps.kind.test]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
