apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata: {name: route-hostnames}
policies: [../.rendered/cluster.yaml]
resources: [resources.yaml]
variables: values.yaml
userinfo: userinfo.yaml
results:
  - {policy: route-hostnames, resources: [own-host], kind: HTTPRoute, result: pass}
  - {policy: route-hostnames, resources: [foreign-host, no-host], kind: HTTPRoute, result: fail}
