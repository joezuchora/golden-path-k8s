{{- /*
Connection-secret delivery (ADR-0002): composed Secret → PushSecret (store "vault", tenant namespace) → the team's vault →
ExternalSecret (store "platform", app namespace). On AKS the vault is the team's Key Vault (Phase 4). On kind
(secrets.backend=kubernetes) it is a namespace per team and env, vault-<team>-<env>, that only two service accounts
can reach: a writer in the tenant namespace and a reader in the app namespace. Developers have no access to it, and no
team's service account can reach another team's vault (D-064).
*/}}
{{- if eq .Values.secrets.backend "kubernetes" }}
{{- range $env := .Values.envs }}
{{- $vault := printf "vault-%s-%s" $.Values.team $env }}
{{- $tenant := printf "tenant-%s-%s" $.Values.team $env }}
{{- $app := printf "%s-%s" $.Values.team $env }}
{{- if eq $.Values.capability "control-plane" }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $vault }}
  labels:
    platform.example.org/vault-for: {{ $app }}
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: eso-vault-writer, namespace: {{ $tenant }}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: vault-writer, namespace: {{ $vault }}}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [authorization.k8s.io]
    resources: [selfsubjectrulesreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: vault-writer, namespace: {{ $vault }}}
subjects: [{kind: ServiceAccount, name: eso-vault-writer, namespace: {{ $tenant }}}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: vault-writer}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: vault-reader, namespace: {{ $vault }}}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch]
  - apiGroups: [authorization.k8s.io]
    resources: [selfsubjectrulesreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: vault-reader, namespace: {{ $vault }}}
subjects: [{kind: ServiceAccount, name: eso-vault-reader, namespace: {{ $app }}}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: vault-reader}
---
# Compositions push connection details to the store named "vault" in the XR's tenant namespace.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata: {name: vault, namespace: {{ $tenant }}}
spec:
  provider:
    kubernetes:
      remoteNamespace: {{ $vault }}
      server:
        url: https://kubernetes.default.svc
        caProvider: {type: ConfigMap, name: kube-root-ca.crt, key: ca.crt}
      auth:
        serviceAccount: {name: eso-vault-writer}
{{- end }}
{{- if eq $.Values.capability "workloads" }}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: eso-vault-reader, namespace: {{ $app }}}
---
# golden-service ExternalSecrets read from the store named "platform" in the app namespace.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata: {name: platform, namespace: {{ $app }}}
spec:
  provider:
    kubernetes:
      remoteNamespace: {{ $vault }}
      server:
        url: https://kubernetes.default.svc
        caProvider: {type: ConfigMap, name: kube-root-ca.crt, key: ca.crt}
      auth:
        serviceAccount: {name: eso-vault-reader}
{{- end }}
{{- end }}
{{- end }}
{{- /*
keyvault backend (AKS, D-078): the same two store names and service accounts as kind, but the store is the team's Key Vault
for that env, reached with Microsoft Entra Workload ID. OpenTofu creates the vault and two identities per team and env: the
writer (Key Vault Secrets Officer, federated to tenant-<team>-<env>/eso-vault-writer on the control-plane cluster) and the
reader (Key Vault Secrets User, federated to <team>-<env>/eso-vault-reader on each workload cluster in the env's group). A
team's service account can't reach another team's vault: Azure RBAC denies it, as Kubernetes RBAC does on kind.
*/}}
{{- if eq .Values.secrets.backend "keyvault" }}
{{- if not .Values.azure.tenantId }}{{ fail "secrets.backend=keyvault needs azure.tenantId (cluster Secret annotation platform.example.org/tenancy-values, written by infra/aks/aks.sh bootstrap)" }}{{ end }}
{{- range $env := .Values.envs }}
{{- $key := printf "%s-%s" $.Values.team $env }}
{{- $t := get $.Values.azure.tenants $key }}
{{- if not $t }}{{ fail (printf "no Key Vault for %s in the cluster's tenancy-values annotation: add the team to infra/envs/<env> (var.teams), apply, and re-run infra/aks/aks.sh bootstrap" $key) }}{{ end }}
{{- range $f := list "keyVaultUrl" "writerClientId" "readerClientId" }}
{{- if not (get $t $f) }}{{ fail (printf "tenancy-values tenants.%s is missing %s" $key $f) }}{{ end }}
{{- end }}
{{- if eq $.Values.capability "control-plane" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-vault-writer
  namespace: tenant-{{ $key }}
  annotations:
    azure.workload.identity/client-id: {{ $t.writerClientId | quote }}
    azure.workload.identity/tenant-id: {{ $.Values.azure.tenantId | quote }}
---
# Compositions push connection details to the store named "vault" in the XR's tenant namespace.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata: {name: vault, namespace: tenant-{{ $key }}}
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: {{ $t.keyVaultUrl | quote }}
      serviceAccountRef: {name: eso-vault-writer}
{{- end }}
{{- if eq $.Values.capability "workloads" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-vault-reader
  namespace: {{ $key }}
  annotations:
    azure.workload.identity/client-id: {{ $t.readerClientId | quote }}
    azure.workload.identity/tenant-id: {{ $.Values.azure.tenantId | quote }}
---
# golden-service ExternalSecrets read from the store named "platform" in the app namespace.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata: {name: platform, namespace: {{ $key }}}
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: {{ $t.keyVaultUrl | quote }}
      serviceAccountRef: {name: eso-vault-reader}
{{- end }}
{{- end }}
{{- end }}
