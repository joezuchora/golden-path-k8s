# Argo CD (control-plane capability, D-023). Installed by the bootstrap; everything else is reconciled from Git.
# Profile-specific settings live in argocd-values-<profile>.yaml.
dex: {enabled: false}
configs:
  params:
    server.insecure: true            # TLS terminates at the platform gateway; in-cluster traffic only
    applicationsetcontroller.policy: create-update   # an AppSet never deletes what it no longer renders without review
  cm:
    admin.enabled: true
    timeout.reconciliation: 60s
    exec.enabled: false
    application.resourceTrackingMethod: annotation
  rbac:
    policy.default: ""               # no implicit read access: every subject needs a role (D-025)
    scopes: "[groups]"
notifications:
  enabled: true
  argocdUrl: http://argocd-server.argocd.svc
  secret:
    create: false                    # argocd-notifications-secret is created by the bootstrap with the Git host token
  # Git feedback (D-043): the sync / admission result, including the Kyverno message, becomes a commit status on the
  # app team's deploy repo: the values source (sources[1]) of an app, or the single source of an XR application.
  # The service URL comes from argocd-values-<profile>.yaml.
  templates:
    template.git-commit-status: |
      webhook:
        git:
          method: POST
          # Templating lives inside the string values: Argo CD parses this block as YAML before it renders the templates.
          # Repo and revision: the values source (sources[1]) of an app, or the only source of an XR application.
          # The revision is the commit this status is about (D-108). While a sync runs or after it fails, that's the
          # operation's own: syncResult once the controller has resolved it, else operation.sync. status.sync can
          # still name the previous commit when the next sync starts (the operation is set before the new comparison
          # is saved), which turned a shipped commit's status back to pending. After a success, status.sync when it's
          # Synced, so a commit that changes no manifest, and gets no sync of its own, still gets a status (D-067).
          path: >-
            {{- $st := .app.status }}{{ $field := "revision" }}{{ $src := 0 }}
            {{- if .app.spec.sources }}{{ $field = "revisions" }}{{ $src = 1 }}{{ end }}
            {{- $revs := list (dig "operationState" "syncResult" $field "" $st) (dig "operationState" "operation" "sync" $field "" $st) (dig "sync" $field "" $st) }}
            {{- if and (eq (dig "operationState" "phase" "" $st) "Succeeded") (eq (dig "sync" "status" "" $st) "Synced") }}{{ $revs = prepend $revs (dig "sync" $field "" $st) }}{{ end }}
            {{- $rev := first (compact $revs) }}{{ if $src }}{{ $rev = index $rev $src }}{{ end -}}
            /repos/{{ if .app.spec.sources }}{{ call .repo.FullNameByRepoURL (index .app.spec.sources 1).repoURL }}{{ else }}{{ call .repo.FullNameByRepoURL .app.spec.source.repoURL }}{{ end }}/statuses/{{ $rev }}
          body: |
            {
              "context": "platform/argocd/{{.app.metadata.name}}",
              "target_url": "{{.context.argocdUrl}}/applications/{{.app.metadata.namespace}}/{{.app.metadata.name}}",
              {{- if eq .app.status.operationState.phase "Running" }}
              "state": "pending", "description": "Argo CD is syncing"
              {{- else if and (eq .app.status.operationState.phase "Succeeded") (eq .app.status.health.status "Healthy") }}
              "state": "success", "description": "Synced and Healthy"
              {{- else if eq .app.status.operationState.phase "Succeeded" }}
              "state": "{{ if eq .app.status.health.status "Degraded" }}failure{{ else }}pending{{ end }}", "description": {{ printf "Synced; health %s: %s. Next: scripts/idp-diagnose.sh %s %s --team %s" .app.status.health.status (.app.status.health.message | default "") (index .app.metadata.labels "platform.example.org/app" | default .app.metadata.name) (index .app.metadata.labels "platform.example.org/env" | default "<env>") (index .app.metadata.labels "platform.example.org/team" | default "<team>") | trunc 900 | toJson }}
              {{- else }}
              "state": "failure", "description": {{ .app.status.operationState.message | trunc 900 | toJson }}
              {{- end }}
            }
  # Dedup keys (D-067, F44): one status per sync operation (startedAt); for health, one per revision, sync operation and
  # health transition (lastTransitionTime). So every commit gets a status (even one that changes no manifest), a revision
  # that goes Healthy → Degraded → Healthy ends on success, and re-evaluating the same state sends nothing.
  triggers:
    trigger.on-git-status: |
      - description: Sync started
        oncePer: "app.status.operationState.startedAt"
        when: app.status.operationState != nil and app.status.operationState.phase in ['Running']
        send: [git-commit-status]
      - description: Sync failed (invalid manifest, AppProject violation, admission denial)
        oncePer: "app.status.operationState.startedAt"
        when: app.status.operationState != nil and app.status.operationState.phase in ['Error', 'Failed']
        send: [git-commit-status]
      - description: Synced and Healthy
        oncePer: "(app.status.sync.revisions != nil ? app.status.sync.revisions[len(app.status.sync.revisions)-1] : app.status.sync.revision) + '/' + app.status.operationState.startedAt + '/' + app.status.health.lastTransitionTime"
        when: app.status.operationState != nil and app.status.operationState.phase in ['Succeeded'] and app.status.health.status == 'Healthy'
        send: [git-commit-status]
      - description: Synced but Degraded (unhealthy rollout)
        oncePer: "(app.status.sync.revisions != nil ? app.status.sync.revisions[len(app.status.sync.revisions)-1] : app.status.sync.revision) + '/' + app.status.operationState.startedAt + '/' + app.status.health.lastTransitionTime"
        when: app.status.operationState != nil and app.status.operationState.phase in ['Succeeded'] and app.status.health.status == 'Degraded'
        send: [git-commit-status]
  subscriptions:
    - recipients: [git]
      triggers: [on-git-status]
      selector: platform.example.org/git-feedback=true
controller:
  resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {memory: 1Gi}}
repoServer:
  resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {memory: 1Gi}}
server:
  resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {memory: 256Mi}}
applicationSet:
  resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {memory: 256Mi}}
redis:
  # Chainguard, digest-pinned (D-090), instead of the chart's anonymous pull from ECR Public, which stalled kind-up on
  # parallel CI runners. Redis 8.x stays on the open-source license line that the chart's comment requires.
  image: {repository: cgr.dev/chainguard/redis, tag: "latest@sha256:0cd153cbb3d09fc56eeb4c3b6097ef6f264cd5eb55383d464ecb9bb92bd0fb36"}
  resources: {requests: {cpu: 50m, memory: 32Mi}, limits: {memory: 128Mi}}
