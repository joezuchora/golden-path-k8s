{{- if not .Values.gitApi }}{{ fail "gitApi must be set in values-<profile>.yaml" }}{{ end }}
# git-feedback reporter (D-075): render failures (Argo CD ComparisonError) become a failed commit status on the team's
# deploy repo. It runs next to Argo CD and reuses the notification bot's Git token (argocd-notifications-secret, D-043).
apiVersion: v1
kind: ConfigMap
metadata:
  name: git-feedback-reporter
  namespace: {{ .Release.Namespace }}
data:
  reporter.py: |
{{ .Files.Get "files/reporter.py" | indent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: git-feedback-reporter, namespace: {{ .Release.Namespace }}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: git-feedback-reporter, namespace: {{ .Release.Namespace }}}
rules:
  - apiGroups: [argoproj.io]
    resources: [applications]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: git-feedback-reporter, namespace: {{ .Release.Namespace }}}
subjects: [{kind: ServiceAccount, name: git-feedback-reporter, namespace: {{ .Release.Namespace }}}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: git-feedback-reporter}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: git-feedback-reporter
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: git-feedback-reporter}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: git-feedback-reporter}
      annotations:
        checksum/script: {{ .Files.Get "files/reporter.py" | sha256sum }}
    spec:
      serviceAccountName: git-feedback-reporter
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: reporter
          image: {{ .Values.image }}
          command: [python, /app/reporter.py]
          env:
            - {name: NAMESPACE, value: {{ .Release.Namespace }}}
            - {name: GIT_API, value: {{ .Values.gitApi | quote }}}
            - {name: DOCS_URL, value: {{ .Values.docsUrl | quote }}}
          resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 96Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: script, mountPath: /app}
            - {name: git-token, mountPath: /var/run/git, readOnly: true}
      volumes:
        - name: script
          configMap: {name: git-feedback-reporter}
        - name: git-token
          secret: {secretName: argocd-notifications-secret, items: [{key: git-token, path: git-token}]}
