{{- if not .Values.gatewayClassName }}{{ fail "gatewayClassName must be set in values-<profile>.yaml" }}{{ end }}
{{- if not .Values.domain }}{{ fail "domain must be set in values-<profile>.yaml" }}{{ end }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: platform-gateway-tls
  namespace: {{ .Release.Namespace }}
spec:
  secretName: platform-gateway-tls
  dnsNames: ["*.{{ .Values.domain }}"]
  privateKey: {algorithm: ECDSA, size: 256}
  issuerRef: {name: {{ .Values.issuer.name }}, kind: {{ .Values.issuer.kind }}, group: cert-manager.io}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: platform
  namespace: {{ .Release.Namespace }}
spec:
  gatewayClassName: {{ .Values.gatewayClassName }}
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.{{ .Values.domain }}"
      allowedRoutes:
        namespaces: {from: Same}       # only the platform's redirect route (feature 6) attaches here
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.{{ .Values.domain }}"
      tls:
        mode: Terminate
        certificateRefs: [{kind: Secret, name: platform-gateway-tls}]
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - {key: platform.example.org/team, operator: Exists}
---
# Contract feature 6: HTTP → HTTPS redirect for every app host, owned by the platform.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs: [{name: platform, sectionName: http}]
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect: {scheme: https, statusCode: 301}
