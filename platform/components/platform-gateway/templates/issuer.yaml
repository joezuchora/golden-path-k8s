{{- if .Values.selfSignedCA }}
# kind only (D-051): a self-signed root that signs a platform CA, which issues the gateway certificate. Test clients
# trust the CA from the platform-ca Secret; nothing here is trusted outside the cluster.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-root
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: platform-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: golden-path kind platform CA
  secretName: platform-ca
  duration: 8760h
  privateKey: {algorithm: ECDSA, size: 256}
  issuerRef: {name: selfsigned-root, kind: ClusterIssuer, group: cert-manager.io}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: platform-ca
spec:
  ca: {secretName: platform-ca}
{{- end }}
