# PostgreSQLInstance, local backend (kind and previews): an in-cluster CloudNativePG Cluster in the XR's tenant namespace,
# composed directly (D-053). The connection Secret is the one CloudNativePG writes for the composed Cluster
# (<name>-app); a composed PushSecret delivers it to the team's secret store (ADR-0002). The tenant Namespace's labels
# are read through ExtraResources (ADR-0011, F36) and stamped on every composed object and the database pods (ADR-0007).
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: postgresqlinstance-local
  labels: {provider: local}
spec:
  compositeTypeRef: {apiVersion: platform.example.org/v1, kind: PostgreSQLInstance}
  mode: Pipeline
  pipeline:
    - step: render
      functionRef: {name: function-go-templating}
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $xr := .observed.composite.resource }}
            {{- $name := $xr.metadata.name }}
            {{- $ns := $xr.metadata.namespace }}
            {{- $er := default (dict) .extraResources }}
            {{- $nsr := index $er "namespace" | default (dict) }}
            {{- $nsl := dict }}
            {{- range (index $nsr "items" | default (list)) }}{{ $nsl = .resource.metadata.labels }}{{ end }}
            {{- $tags := dict }}
            {{- range $k := list "team" "owner" "cost-center" "env" "data-classification" "contract-version" }}
            {{- $key := printf "platform.example.org/%s" $k }}
            {{- if hasKey $nsl $key }}{{ $_ := set $tags $key (index $nsl $key) }}{{ end }}
            {{- end }}
            {{- $_ := set $tags "platform.example.org/dependency" $name }}
            ---
            apiVersion: meta.gotemplating.fn.crossplane.io/v1alpha1
            kind: ExtraResources
            requirements:
              namespace:
                apiVersion: v1
                kind: Namespace
                matchName: {{ $ns | quote }}
            {{- if $nsl }}
            ---
            apiVersion: postgresql.cnpg.io/v1
            kind: Cluster
            metadata:
              name: {{ $name }}
              labels: {{ toJson $tags }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: cluster
            spec:
              instances: 1
              enableSuperuserAccess: false
              storage:
                size: {{ printf "%dGi" (int $xr.spec.storageGB) }}
              bootstrap:
                initdb: {database: app, owner: app}
              inheritedMetadata:
                labels: {{ toJson $tags }}
              resources:
                requests: {cpu: 50m, memory: 128Mi}
                limits: {memory: 512Mi}
            ---
            apiVersion: external-secrets.io/v1alpha1
            kind: PushSecret
            metadata:
              name: {{ $name }}
              labels: {{ toJson $tags }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: connection
            spec:
              refreshInterval: 10s
              deletionPolicy: Delete
              updatePolicy: Replace
              secretStoreRefs: [{name: vault, kind: SecretStore}]
              selector:
                secret: {name: {{ printf "%s-app" $name }}}
              template:
                engineVersion: v2
                data:
                  host: {{ printf "%s-rw.%s.svc.cluster.local" $name $ns }}
                  port: "5432"
                  dbname: app
                  username: '{{ "{{" }} .username {{ "}}" }}'
                  password: '{{ "{{" }} .password {{ "}}" }}'
              data:
                {{- range $k := list "host" "port" "dbname" "username" "password" }}
                - match:
                    secretKey: {{ $k }}
                    remoteRef: {remoteKey: {{ $name }}, property: {{ $k }}}
                {{- end }}
            ---
            apiVersion: {{ $xr.apiVersion }}
            kind: {{ $xr.kind }}
            status:
              connectionSecret: {{ $name }}
            {{- end }}
    - step: ready
      functionRef: {name: function-auto-ready}
