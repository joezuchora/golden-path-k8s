{{- $p := .Values.compositionProvider }}
{{- if not (has $p (list "local" "azure")) }}{{ fail "compositionProvider must be local or azure (values-<profile>.yaml)" }}{{ end }}
# Composition functions (ADR-0011): one templating language for every composition, plus readiness from conditions.
apiVersion: pkg.crossplane.io/v1
kind: Function
metadata: {name: function-go-templating}
spec: {package: {{ .Values.functions.goTemplating }}}
---
apiVersion: pkg.crossplane.io/v1
kind: Function
metadata: {name: function-auto-ready}
spec: {package: {{ .Values.functions.autoReady }}}
---
# XRD v1 (contract v1 surface, D-014). Namespaced, no claims (D-024). No team, owner, cost-center or tag fields: tags are
# derived from the XR's Namespace by the composition (ADR-0007, D-017). The composition is enforced per profile, so an
# app team can't pick a backend; the API is identical on kind and AKS.
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: postgresqlinstances.platform.example.org
spec:
  group: platform.example.org
  names: {kind: PostgreSQLInstance, plural: postgresqlinstances}
  scope: Namespaced
  enforcedCompositionRef: {name: postgresqlinstance-{{ $p }}}
  defaultCompositeDeletePolicy: Foreground
  versions:
    - name: v1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          description: A PostgreSQL database for one app. Connection details arrive in the app's namespace as a Secret (ADR-0002).
          properties:
            spec:
              type: object
              # The owning app can be set once and never changed or removed: a different app needs a new database and a
              # data migration (D-102).
              x-kubernetes-validations:
                - rule: "!has(oldSelf.app) || (has(self.app) && self.app == oldSelf.app)"
                  message: "spec.app is immutable once set: a different app needs a new database request and a data migration (D-102)"
              properties:
                app:
                  type: string
                  maxLength: 63
                  pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
                  description: >-
                    The one app this database serves (D-102): the name of an AppIdentity in the same namespace. On AKS only
                    that app's identity gets a database role; without it the database grants nothing. Immutable once set.
                storageGB:
                  type: integer
                  minimum: 1
                  maximum: 64
                  default: 1
                  description: Storage in GiB.
                version:
                  type: string
                  enum: ["17"]
                  default: "17"
                  description: PostgreSQL major version.
            status:
              type: object
              properties:
                connectionSecret:
                  type: string
                  description: The key in the team's secret store that holds the connection details.
---
# AppIdentity XRD v1 (ADR-0008, ADR-0013, D-104): the app's own cloud identity, federated to the ServiceAccount named after
# the app in <team>-<env> on every workload cluster in the env's group. The XR's name is the app; there are no fields to
# set, because issuers, subjects, scopes and grants all come from the platform (the tenant Namespace and the environment),
# never from the request. Which database an app may use is set on the database (PostgreSQLInstance.spec.app, D-102).
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: appidentities.platform.example.org
spec:
  group: platform.example.org
  names: {kind: AppIdentity, plural: appidentities}
  scope: Namespaced
  enforcedCompositionRef: {name: appidentity-{{ $p }}}
  defaultCompositeDeletePolicy: Foreground
  versions:
    - name: v1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          description: >-
            The cloud identity of one app (its name), federated to the app's ServiceAccount. Its client and tenant IDs arrive
            in the app's namespace as a Secret, like a database's connection details (ADR-0002).
          properties:
            spec:
              type: object
              description: No fields. The XR's name is the app; everything else is derived by the platform.
            status:
              type: object
              properties:
                identitySecret:
                  type: string
                  description: The key in the team's secret store that holds the identity's client and tenant IDs.
                subject:
                  type: string
                  description: The ServiceAccount the identity is federated to.
                issuers:
                  type: array
                  items: {type: string}
                  description: The workload clusters' OIDC issuers the identity trusts.
                clientId:
                  type: string
                  description: The identity's client ID (AKS).
                principalId:
                  type: string
                  description: The identity's principal (object) ID, which database roles bind to (AKS).
{{- if eq $p "local" }}
{{- if not .Values.local.issuer }}{{ fail "compositionProvider=local needs local.issuer (values-kind.yaml): the service-account issuer of the kind cluster" }}{{ end }}
---
# kind's counterpart of the azure-platform EnvironmentConfig that infra/aks/aks.sh writes (D-104): the OIDC issuer of the
# one cluster, which is both control plane and workload cluster, in the "shared" workload group (D-079). AppIdentity's
# local composition records the federation it would create, and the e2e checks real projected tokens against it.
apiVersion: apiextensions.crossplane.io/v1beta1
kind: EnvironmentConfig
metadata: {name: local-platform}
data:
  tenantId: local
  workloadIssuers:
    shared:
      - {cluster: in-cluster, issuer: {{ .Values.local.issuer | quote }}}
{{- end }}
{{- range $path, $_ := .Files.Glob (printf "compositions/%s/*.yaml" $p) }}
---
{{ $.Files.Get $path }}
{{- end }}
---
# Crossplane composes CloudNativePG clusters (local, D-053) and ESO PushSecrets (connection delivery, ADR-0002) directly,
# so its service account needs these kinds (F27), and reads Namespaces for tags.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: crossplane-compose-platform
  labels: {rbac.crossplane.io/aggregate-to-crossplane: "true"}
rules:
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusters]
    verbs: ["*"]
  - apiGroups: [external-secrets.io]
    resources: [pushsecrets]
    verbs: ["*"]
  # Compositions read the XR's Namespace (ExtraResources) to derive tags (ADR-0007, F36).
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, watch]
{{- if eq $p "azure" }}
{{- /* Workload Identity for the providers (D-081, D-083, D-099): no stored credential and no identity of Crossplane's own.
Terraform creates a provider UAMI per tenant and federates it to each provider's service account by name
(system:serviceaccount:crossplane-system:<provider>), so each provider gets a DeploymentRuntimeConfig that fixes its
service account's name. The webhook projects the token for any pod labeled azure.workload.identity/use, with or without a
client-id annotation (F65); which identity a request uses is the client ID in the tenant's namespaced ProviderConfig,
rendered by the tenancy chart. There is deliberately no ClusterProviderConfig: any namespace could use one (F63), and
make validate fails if one is rendered. The tenant ID comes from the cluster Secret's platform-values annotation. */}}
{{- $az := .Values.global.azure }}
{{- if not $az.tenantId }}{{ fail "compositionProvider=azure needs global.azure.tenantId (cluster Secret annotation platform.example.org/platform-values, written by infra/aks/aks.sh bootstrap)" }}{{ end }}
{{- range .Values.azure.providers }}
{{- $prov := regexReplaceAll ":.*$" (base .) "" }}
---
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata: {name: {{ $prov }}}
spec:
  serviceAccountTemplate:
    metadata:
      name: {{ $prov }}
      annotations:
        azure.workload.identity/tenant-id: {{ $az.tenantId | quote }}
  deploymentTemplate:
    spec:
      selector: {}
      template:
        metadata:
          labels: {azure.workload.identity/use: "true"}
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata: {name: {{ $prov }}}
spec:
  package: {{ . }}
  runtimeConfigRef: {name: {{ $prov }}}
{{- end }}
{{- end }}
