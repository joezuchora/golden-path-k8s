# Every PR (D-047): static checks, policy tests and the kind journeys. Public-repo runners have 4 CPU / 16 GB (F28).
name: pr-checks
on:
  pull_request: {}
  workflow_dispatch: {}

permissions: {contents: read}

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - run: make tools
      - name: make validate (every check must run; a SKIP fails, D-069)
        run: make validate
        env: {REQUIRE_ALL: "1"}
      - name: make test-policies (online: registry + Rekor, F35)
        run: make test-policies
      - name: verify-docs
        run: bash scripts/verify-docs.sh

  kind-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - run: make doctor
      - name: The CI-built fixtures exist and pull anonymously (D-065, D-069)
        run: |
          grep -q PENDING tests/e2e/lib/images.env && { echo "::error::tests/e2e/lib/images.env has no CI-built digests"; exit 1; } || true
          make doctor PROFILE=github
        env: {GH_TOKEN: "${{ github.token }}"}
      - run: make kind-up
      - run: make e2e-all
      - name: Diagnostics on failure
        if: failure()
        run: |
          export PATH="$PWD/.bin:$PATH"
          kubectl get applications -A || true
          kubectl get pods -A | grep -vE 'Running|Completed' || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -50 || true
      - name: Reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: {name: e2e-reports, path: .e2e-reports/, if-no-files-found: ignore}
