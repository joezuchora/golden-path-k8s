# cilium_mode=managed (AKS, Phase 4). golden-service has no mode-specific output: the app depends only on HTTPRoute and
# CiliumNetworkPolicy (CLAUDE.md invariant), so this file must stay identical to the other mode's; make validate diffs the renders.
# The domain and dependency egress are set by the AKS environment in Phase 4.
platform:
  domain: apps.aks.invalid
  dependencyEgress: none
  identityEgress: world        # token exchange with Microsoft Entra ID: TCP 443 to world until the L7/FQDN profile (D-021, D-105)
