{{- range .Values.dependencies.postgres }}
---
# Connection details for the XR "{{ . }}": composed Secret → PushSecret → the team's store → this ExternalSecret
# (ADR-0002). The store is the namespace's SecretStore "{{ $.Values.platform.secretStore }}", rendered by tenancy.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $.Values.app }}-{{ . }}-db
  labels:
    {{- include "gs.labels" $ | nindent 4 }}
    platform.example.org/dependency: {{ . }}
spec:
  refreshInterval: 15s
  secretStoreRef: {kind: SecretStore, name: {{ $.Values.platform.secretStore }}}
  target:
    name: {{ $.Values.app }}-{{ . }}-db
    creationPolicy: Owner
    deletionPolicy: Delete
  dataFrom:
    - extract: {key: {{ . }}}
{{- end }}
